name: Daily InfoSec News

on:
  schedule:
    # 每天 UTC 時間 00:00 運行（台灣時間早上 8:00）
    - cron: '05 1 * * *'
  
  # 允許手動觸發（用於測試）
  workflow_dispatch:

jobs:
  send-news:
    runs-on: ubuntu-latest
    
    steps:
      - name: 檢查程式碼
        uses: actions/checkout@v4

      - name: 設置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝依賴套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 執行新聞發送腳本
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHANNEL_ID: ${{ secrets.TG_CHANNEL_ID }}
        run: python main.py
